<style>
html,body{margin:0;height:100%;overflow:hidden;background:#F2E9D4;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
#stage{position:fixed;left:0;top:0;width:390px;transform-origin:0 0}
#fatal{position:fixed;left:16px;right:16px;bottom:16px;padding:12px 16px;border-radius:14px;background:#2B2118;color:#fff;font:500 13px/1.5 sans-serif;display:none;z-index:9}

body{margin:0}
a{color:var(--blue)}a:hover{color:var(--title)}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:var(--sub)}
@keyframes sn-spin{to{transform:rotate(360deg)}}
@keyframes sn-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes sn-bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes sn-speed{0%{transform:translateX(6px);opacity:0}40%{opacity:.6}100%{transform:translateX(-8px);opacity:0}}
@keyframes sn-bob{from{transform:translateY(0)}to{transform:translateY(-1px)}}
@keyframes sn-dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.sn-dots::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:sn-dots 1.2s steps(1) infinite}

</style>
</head>

</div>

<div style="flex-shrink: 0; align-self: flex-start; background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--card-shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 14px; font-size: 15px; font-weight: 700; color: var(--ink); padding: 8px 14px; margin-top: 6px">{{editTitle}}</div>
<div style="flex-shrink: 0; background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--card-shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
